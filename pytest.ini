[pytest]
testpaths = tests
# The repo is imported from the checkout rather than installed, so `tradeval`
# is only importable if the root is on sys.path. `python -m pytest` puts it
# there itself and CI runs it that way; the `pytest` console script does not,
# and the bare `tests/tradeval/` directory then answers `import tradeval` as an
# empty namespace package. Naming the root here makes both invocations work.
pythonpath = .
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
