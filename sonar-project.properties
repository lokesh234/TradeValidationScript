# Local SonarQube analysis; run scripts/sonar.sh.
sonar.projectKey=tradevalidationscripts
sonar.projectName=Tradeval Trade API
sonar.sourceEncoding=UTF-8
sonar.sources=tradeval,serve.py,validate.py,scripts
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# Blame hangs inside the scanner container; it only feeds "new code" tracking,
# which a local, on-demand scan does not use.
sonar.scm.disabled=true

# Reviewed findings, kept on purpose.
sonar.issue.ignore.multicriteria=db1,db2,rsi1
# The default "tradeval" password is the local Docker Postgres's (docker-compose.yml);
# anything hosted sets TRADEVAL_DATABASE_URL or TRADEVAL_DB_PASSWORD instead.
sonar.issue.ignore.multicriteria.db1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.db1.resourceKey=tradeval/store/db.py
# The password-less URL is safe_url, a display string that is never connected with.
sonar.issue.ignore.multicriteria.db2.ruleKey=python:S2115
sonar.issue.ignore.multicriteria.db2.resourceKey=tradeval/store/db.py
# RSI's "no losses at all" is an exact zero from the EWM; a tolerance would turn 99.99 into 100.
sonar.issue.ignore.multicriteria.rsi1.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.rsi1.resourceKey=tradeval/analysis/indicators.py
